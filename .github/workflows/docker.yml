# Builds and publishes the container image to GitHub Container Registry.
# The owner half of the image name tracks the repository owner automatically,
# so an account rename never strands publishing on a hardcoded name (that
# bit us once; GHCR does not redirect old package paths).
#
#   ghcr.io/<owner>/talk-wave:latest   <- every push to main
#   ghcr.io/<owner>/talk-wave:beta     <- every push to a `beta` branch
#   ghcr.io/<owner>/talk-wave:dev      <- every push to the `dev` branch
#   ghcr.io/<owner>/talk-wave:1.2.3    <- tags like v1.2.3
#
# `dev` is where work in progress lands: it builds a real image you can pull
# on the NAS without moving `:latest`, which stays whatever main last shipped.
#
# One image serves both services: the worker runs the default CMD, the
# token server overrides the command in compose.
#
# NOTE: the first published package is PRIVATE by default. Make it public
# once (GitHub -> your profile -> Packages -> talk-wave -> settings) or
# `docker login ghcr.io` on the machine that pulls.
name: docker

on:
  push:
    branches: [main, beta, dev]
    tags: ["v*"]
  # A dev -> main pull request runs the suite before you can merge it.
  # It builds nothing: PRs publish no image.
  pull_request:
    branches: [main]
  # Run it by hand against any branch. Added after a GitHub Actions outage
  # ("Failed to resolve action download info: Service Unavailable") failed the
  # run for 0.9.98 before the suite executed, and the eleven commits pushed
  # after it produced no runs at all — so the image on ghcr silently stayed
  # eleven versions behind the branch with nothing red to explain why. Without
  # this the only ways back were an empty commit or re-running an old one at
  # the wrong tree.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Nothing reaches :latest without the suite passing. Two broken images
  # shipped in one afternoon — an unresolvable adapter path and a shadowed
  # name — both of which the tests caught the moment they were asked to.
  # The build is the expensive step; this gate costs about a minute.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r agent-worker/requirements.txt
      # Lint before the suite so a shadowed name or undefined reference fails in
      # a second rather than after the full run. Gates only the bug-classes
      # (see agent-worker/ruff.toml); pinned so a ruff release can't add a rule
      # that reds the build without anyone choosing it.
      - name: Lint (ruff)
        working-directory: agent-worker
        run: |
          pip install ruff==0.16.5
          ruff check .
      - name: Unit tests
        working-directory: agent-worker
        env:
          LOG_TO_FILE: "0"
          # Point every writable path away from the checkout, so a test can
          # never scribble on real settings, secrets or auth files. run_tests
          # gives each parallel worker its OWN temp dir on top of these, so
          # the modules cannot collide.
          SETTINGS_PATH: /tmp/ci-settings.json
          SECRETS_PATH: /tmp/ci-secrets.json
          ADMIN_AUTH_PATH: /tmp/ci-auth.json
          CALLS_PATH: /tmp/ci-calls
        # The same suite, one process per module in parallel — the aggregator
        # (python -m unittest test_sidecar) still works and is what the module
        # coverage guard pins against, but this is 2-3x faster on CI's cores.
        run: python run_tests.py

  build-and-push:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/talk-wave
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: agent-worker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
