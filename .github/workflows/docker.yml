# Builds and publishes the container image to GitHub Container Registry.
#
#   ghcr.io/mrainone7p/wave-talk:latest   <- every push to main
#   ghcr.io/mrainone7p/wave-talk:beta     <- every push to a `beta` branch
#   ghcr.io/mrainone7p/wave-talk:dev      <- every push to the `dev` branch
#   ghcr.io/mrainone7p/wave-talk:1.2.3    <- tags like v1.2.3
#
# `dev` is where work in progress lands: it builds a real image you can pull
# on the NAS without moving `:latest`, which stays whatever main last shipped.
#
# One image serves both services: the worker runs the default CMD, the
# token server overrides the command in compose.
#
# NOTE: the first published package is PRIVATE by default. Make it public
# once (GitHub -> your profile -> Packages -> wave-talk -> settings) or
# `docker login ghcr.io` on the machine that pulls.
name: docker

on:
  push:
    branches: [main, beta, dev]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  # Nothing reaches :latest without the suite passing. Two broken images
  # shipped in one afternoon — an unresolvable adapter path and a shadowed
  # name — both of which the tests caught the moment they were asked to.
  # The build is the expensive step; this gate costs about a minute.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r agent-worker/requirements.txt
      - name: Unit tests
        working-directory: agent-worker
        env:
          LOG_TO_FILE: "0"
          # Point every writable path away from the checkout, so a test can
          # never scribble on real settings, secrets or auth files.
          SETTINGS_PATH: /tmp/ci-settings.json
          SECRETS_PATH: /tmp/ci-secrets.json
          ADMIN_AUTH_PATH: /tmp/ci-auth.json
          CALLS_PATH: /tmp/ci-calls
        run: python -m unittest test_sidecar -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/mrainone7p/wave-talk
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: agent-worker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
