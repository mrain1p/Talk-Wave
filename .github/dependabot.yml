# The maintainability plan's cadence tier, RE-SCOPED 2026-09-01 after its
# first firing buried the operator under ten version-bump PRs in an hour
# (livekit group, mcp 1.29->2.1, a python:3.14 base image) — every one of
# them fighting pins that requirements.txt and constraints.txt hold on
# purpose. open-pull-requests-limit: 0 means NO version-update PRs, ever;
# Dependabot still watches the manifests and SECURITY updates still arrive
# as PRs, which is the half of the cadence worth having. Everything that
# does arrive lands on dev — :latest builds from main and feeds the live
# NAS, so no automated PR may target it.
version: 2
updates:
  - package-ecosystem: pip
    directory: /agent-worker
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 0

  - package-ecosystem: docker
    directory: /agent-worker
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 0
