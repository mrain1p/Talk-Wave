# Deploys the whole call-in stack: LiveKit media server, the agent worker,
# and the token/widget server. For local dev on Windows use run-local.ps1
# instead — no Docker needed.
#
# The two python services share ONE image, published as
# ghcr.io/mrainone7p/wave-talk:latest. With a source checkout,
# `docker compose up -d --build` builds it locally instead of pulling.
#
# Before first deploy:
#   - copy livekit.example.yaml -> livekit.yaml with a FRESH keypair, set
#     use_external_ip: true, and open the UDP range on the router
#   - copy .env.example -> .env; LIVEKIT_PUBLIC_URL must be what the BROWSER
#     reaches (wss://... via your reverse proxy), not the internal name
#   - put a reverse proxy (Caddy/Traefik/nginx) in front of port 8100, set
#     CALLIN_ALLOWED_ORIGINS to your real origins and CALLIN_ADMIN_KEY to a
#     secret before this is reachable beyond your LAN
#   - set SUBWAVE_STREAM_URL to the station's PUBLIC https stream. Serving the
#     widget over TLS (which the bundled caddy below does, and which browsers
#     require for the microphone) means the caller's browser will refuse the
#     station's plain-http LAN stream as mixed content — silently, so the call
#     runs with no music behind it. See Troubleshooting in the README.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ONE deployment variable: HOST_IP — the LAN address of the machine running
  # this stack. It drives the LiveKit media address, the URL browsers connect
  # to, and the webhook callback. Set it in .env or your stack GUI's
  # environment panel; every service below derives from it.
  livekit-server:
    image: livekit/livekit-server:v1.13.5
    # Without --node-ip a containerized LiveKit advertises its CONTAINER IP
    # as the media address — signalling works, audio never flows, calls hang
    # at "Ringing". The pipeline's "Browser media path" stage catches this.
    command: --config /etc/livekit.yaml --node-ip ${HOST_IP:-127.0.0.1}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    ports:
      - "7880:7880"                     # HTTP/WebSocket signaling
      - "7881:7881"                     # RTC TCP fallback
      # ONE muxed UDP port for all call audio (rtc.udp_port in livekit.yaml).
      # This is the only port that has to reach the internet for calls from
      # outside your network — one firewall rule, not a hundred and one.
      - "7882:7882/udp"                 # RTC media
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    networks:
      - callin-net

  agent-worker:
    image: ghcr.io/mrainone7p/wave-talk:latest
    build:
      context: .
      dockerfile: agent-worker/Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    env_file: .env
    environment:
      - LIVEKIT_URL=ws://livekit-server:7880
      # The worker releases call slots by calling the token server.
      - CALLIN_INTERNAL_URL=http://token-server:8100
      # Container stdout is already captured by docker; file logs would just
      # duplicate it. The shared data volume below is still needed for
      # settings/secrets.
      - LOG_TO_FILE=0
    volumes:
      # Settings and API keys entered in the panel live here. BOTH python
      # services must see the same directory, or panel changes never reach
      # the worker — and they must survive a rebuild.
      - ./data:/data
      # Optional: uncomment to edit TTS adapter configs without a rebuild.
      # - ./agent-worker/tts-adapters:/app/tts-adapters
    depends_on:
      - livekit-server
    networks:
      - callin-net

  token-server:
    image: ghcr.io/mrainone7p/wave-talk:latest
    build:
      context: .
      dockerfile: agent-worker/Dockerfile
    command: ["python", "token_server.py"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    env_file: .env
    environment:
      # Inside a container "localhost" is the container itself — the env
      # file's dev default would make the LiveKit health check fail.
      - LIVEKIT_URL=ws://livekit-server:7880
      # Browsers connect here; station webhooks call back here. Both derive
      # from HOST_IP so one variable configures the whole deployment.
      # LiveKit signalling goes through the caddy TLS port — same origin as
      # the page, so the one-time self-signed acceptance covers it.
      - LIVEKIT_PUBLIC_URL=wss://${HOST_IP:-localhost}:8443
      - CALLIN_HOOK_URL=http://${HOST_IP:-localhost}:8100/hooks/station
      # Where the CALLER'S BROWSER pulls the broadcast from while on the line.
      # Only this service needs it — it builds /live, which is what the widget
      # reads. Blank derives the station's own address, which is plain http on
      # the LAN: correct for a plain-http deployment, and blocked as mixed
      # content on any TLS one (including via the caddy service below), where
      # the caller then hears no station at all. A bare origin works too — the
      # mounts the station publishes are discovered, mp3 first.
      - SUBWAVE_STREAM_URL=${SUBWAVE_STREAM_URL:-}
      - LOG_TO_FILE=0
    volumes:
      - ./data:/data
    ports:
      - "8100:8100"     # widget + token mint; put a reverse proxy in front
    depends_on:
      - livekit-server
    networks:
      - callin-net

  # TLS front door. Browsers only allow the microphone on HTTPS origins, so
  # the widget MUST be opened via https://<HOST_IP>:8443 — the plain :8100
  # port stays for same-machine dev and the station webhook callback.
  caddy:
    image: caddy:2
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    ports:
      - "8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - token-server
      - livekit-server
    networks:
      - callin-net

volumes:
  caddy-data:

networks:
  callin-net:
    driver: bridge
