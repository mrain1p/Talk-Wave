# TALK-WAVE — the whole call-in stack:
#   1. LiveKit (media)
#   2. The worker (the DJ)
#   3. The token/widget web server
#   4. A Caddy TLS front door (optional — skip it if your own reverse proxy terminates TLS)
#
# QUICK START:
#   1. cp livekit.example.yaml livekit.yaml    (generate a FRESH keypair — the app reads it from here too)
#   2. cp .env.example .env                    (set HOST_IP — this machine's LAN address)
#   3. docker compose up -d
#   4. open https://<HOST_IP>:8443 — set the admin password, add an API key, press Call
#      (HTTPS is required for the microphone; first visit shows a one-time certificate screen)
#
# FILE STRUCTURE — what YOU create (everything else the app writes into data/ as it runs):
#   talk-wave/
#   ├── docker-compose.yaml   ← this file
#   ├── .env                  ← cp .env.example .env, set HOST_IP
#   ├── livekit.yaml          ← cp livekit.example.yaml livekit.yaml, fresh keypair
#   ├── Caddyfile             ← from the repo, as-is (skip if using your own proxy)
#   └── data/                 ← created and owned FOR you on first start — it IS the backup
#
# NOTES:
#   - Using your own reverse proxy? Delete the caddy service and replicate BOTH Caddyfile
#     routes — the site to talkwave-web:8100 AND /rtc to livekit-server:7880 (websocket).
#     See docs/networking.md.
#   - Want callers from outside your network? Follow docs/networking.md (one router
#     rule), then swap the two command lines under livekit-server — LAN callers keep
#     working through your router.

services:
  # Runs ONCE as root before the app starts: hands data/ to the app's uid and
  # exits. This is why there is no chown step in the quick start — and if your
  # data/ is already owned right, this whole service (and the two depends_on
  # blocks below) can simply be deleted.
  talkwave-init:
    image: ghcr.io/mrain1p/talk-wave:latest
    container_name: talkwave-init
    user: "0:0"
    command: ["sh", "-c", "chown -R 1000:1000 /data && chmod -R u+rwX /data"]
    restart: "no"
    volumes:
      - ./data:/data

  livekit-server:
    image: livekit/livekit-server:v1.13.5                                  # keep version pinned
    container_name: livekit-server
    command: --config /etc/livekit.yaml --node-ip ${HOST_IP:-127.0.0.1}    # zero-config LAN default
    # command: --config /etc/livekit.yaml                                  # ← SWAP with the line above for callers from ANYWHERE — one router rule first (docs/networking.md); LAN keeps working
    restart: unless-stopped
    ports:
      - "7880:7880"                                                        # signalling (WebSocket)
      - "7881:7881"                                                        # TCP fallback for callers whose networks block UDP
      - "7882:7882/udp"                                                    # ALL call audio, muxed — forward THIS one on your router for off-LAN
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro                                # your keypair config from step 1

  talkwave-worker:
    image: ghcr.io/mrain1p/talk-wave:latest
    container_name: talkwave-worker
    restart: unless-stopped
    stop_grace_period: 2m                                                 # keep at 2m so a redeploy mid-call gets to finish the goodbye + transcript
    env_file:
      - path: .env                                                        # optional — HOST_IP and any baseline config
        required: false
    environment:
      - LIVEKIT_URL=ws://livekit-server:7880                              # must match the livekit service's name above
      - CALLIN_INTERNAL_URL=http://talkwave-web:8100                      # must match the web service's name below
      - LOG_TO_FILE=0                                                     # keep 0 — docker captures stdout already
    volumes:
      - ./data:/data                                                      # keep IDENTICAL to the web half's mount below
      - ./livekit.yaml:/etc/livekit.yaml:ro                               # the keypair is read from here when .env doesn't set one
      - talkwave-cache:/home/app/.cache                                   # keep — holds the ~141MB STT model so recreates don't re-download it
    depends_on:
      talkwave-init:
        condition: service_completed_successfully                         # data/ is owned right before this starts

  talkwave-web:
    image: ghcr.io/mrain1p/talk-wave:latest
    container_name: talkwave-web
    command: ["python", "token_server.py"]                                # this override runs the WEB half
    restart: unless-stopped
    env_file:
      - path: .env                                                        # optional — HOST_IP and any baseline config
        required: false
    environment:
      - LIVEKIT_URL=ws://livekit-server:7880                              # matches the livekit service's name above
      - LIVEKIT_PUBLIC_URL=wss://${HOST_IP:-localhost}:8443               # what the BROWSER dials (via the bundled caddy)
      # - LIVEKIT_PUBLIC_URL=wss://call.example.com                       # SWAP the one above to this version for proxy/domain (docs/networking.md)
      - CALLIN_HOOK_URL=http://${HOST_IP:-localhost}:8100/hooks/station   # where the station posts webhooks — derived from HOST_IP; change only if SUB/WAVE is on ANOTHER network (then use your public https URL)
      - LOG_TO_FILE=0                                                     # keep at 0 — docker captures stdout already
    volumes:
      - ./data:/data                                                      # keep IDENTICAL to the worker's mount above
      - ./livekit.yaml:/etc/livekit.yaml:ro                               # the keypair is read from here when .env doesn't set one
    ports:
      - "8100:8100"                                                       # widget + API, plain http — keep it behind the TLS door or your proxy
    depends_on:
      talkwave-init:
        condition: service_completed_successfully                         # data/ is owned right before this starts

  # CADDY IS OPTIONAL — delete this whole service if your own reverse proxy terminates TLS (see NOTES)
  caddy:
    image: caddy:2                                                        # keep at 2 — pins the major so a routine pull can't break the door
    container_name: talkwave-caddy
    restart: unless-stopped
    ports:
      - "8443:8443"                                                       # the HTTPS front door — this is the address from quick start step 5
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro                               # from the repo as-is — edit only to change routes
      - caddy-data:/data

volumes:
  talkwave-cache:
  caddy-data:
