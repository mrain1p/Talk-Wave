# Deploys the whole call-in stack: LiveKit media server, the agent worker, and the token/widget
# server. For local dev on Windows use run-local.ps1 instead — no Docker needed.
#
# The two python services share ONE image, published as ghcr.io/mrainone7p/wave-talk:latest. With a
# source checkout, `docker compose up -d --build` builds it locally instead of pulling.
#
# Before first deploy:
#   - copy livekit.example.yaml -> livekit.yaml with a FRESH keypair, set
#     use_external_ip: true, and open the UDP range on the router
#   - copy .env.example -> .env; LIVEKIT_PUBLIC_URL must be what the BROWSER
#     reaches (wss://... via your reverse proxy), not the internal name
#   - make ./data usable by the container's user (see the volume note below)
#   - put a reverse proxy (Caddy/Traefik/nginx) in front of port 8100, set
#     CALLIN_ALLOWED_ORIGINS to your real origins and CALLIN_ADMIN_KEY to a
#     secret before this is reachable beyond your LAN
#   - set SUBWAVE_STREAM_URL to the station's PUBLIC https stream. Serving the
#     widget over TLS (which the bundled caddy below does, and which browsers
#     require for the microphone) means the caller's browser will refuse the
#     station's plain-http LAN stream as mixed content — silently, so the call
#     runs with no music behind it. See Troubleshooting in the README.
#
# UPGRADING FROM 0.9.64 OR EARLIER: from 0.9.65 both python services run as uid 1000 instead of
# root, so the bind-mounted ./data has to be readable and writable by that user. Run this ONCE on
# the host before pulling — it is safe against the still-running root container, which ignores
# permission bits:
#
#     chown -R 1000:1000 ./data
#     chmod -R u+rwX     ./data
#
# Both. Ownership alone is not enough: some filesystems (Synology shares among them) create files
# with mode 000, which root reads straight through and an owner cannot. Skipping this fails SHUT and
# both services log the exact fix at startup — an unreadable password file counts as "a password is
# set that nothing can satisfy", never as "no password set", so it cannot leave the panel open.
# CALLIN_ADMIN_KEY is the way back in.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ONE deployment variable: HOST_IP — the LAN address of the machine running this stack. It drives
  # the LiveKit media address, the URL browsers connect to, and the webhook callback. Set it in .env
  # or your stack GUI's environment panel; every service below derives from it.
  #
  # Every service pins container_name because without it compose derives <project>-<service>-1 and
  # a stack GUI reads "stack-wavetalk-wavetalk-worker-1" where a person wants "wavetalk-worker".
  # The cost — no `--scale` on a named service — is nothing here: the ports are fixed anyway.
  # In-network DNS still uses the SERVICE names (token-server, livekit-server), so the URLs below
  # are unaffected.
  livekit-server:
    image: livekit/livekit-server:v1.13.5
    container_name: livekit-server
    # Without --node-ip a containerized LiveKit advertises its CONTAINER IP as the media address —
    # signalling works, audio never flows, calls hang at "Ringing". The pipeline's "Browser media
    # path" stage catches this.
    command: --config /etc/livekit.yaml --node-ip ${HOST_IP:-127.0.0.1}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    ports:
      - "7880:7880"                     # HTTP/WebSocket signaling
      - "7881:7881"                     # RTC TCP fallback
      # ONE muxed UDP port for all call audio (rtc.udp_port in livekit.yaml). This is the only port
      # that has to reach the internet for calls from outside your network — one firewall rule, not
      # a hundred and one.
      - "7882:7882/udp"                 # RTC media
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    networks:
      - callin-net

  agent-worker:
    image: ghcr.io/mrainone7p/wave-talk:latest
    container_name: wavetalk-worker
    build:
      context: .
      dockerfile: agent-worker/Dockerfile
    restart: unless-stopped
    # Docker's default is 10 seconds and then SIGKILL — which lands mid-call on redeploy: the
    # worker's own shutdown budget is 60s (transcript write, slot release, the wrap-up line), and
    # a kill inside it loses all three. Two minutes covers the budget with room; `compose down`
    # only actually waits when a call is up.
    stop_grace_period: 2m
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    env_file: .env
    environment:
      - LIVEKIT_URL=ws://livekit-server:7880
      # The worker releases call slots by calling the token server.
      - CALLIN_INTERNAL_URL=http://token-server:8100
      # Container stdout is already captured by docker; file logs would just duplicate it. The
      # shared data volume below is still needed for settings/secrets.
      - LOG_TO_FILE=0
    volumes:
      # Settings and API keys entered in the panel live here. BOTH python services must see the same
      # directory, or panel changes never reach the worker — and they must survive a rebuild.
      #
      # Owned by uid 1000, which is what the container runs as. See the chown/chmod note at the top
      # of this file if you are upgrading.
      - ./data:/data
      # The local speech-to-text model (~141MB) downloads on first use into the container's writable
      # layer, so without this every recreate pays for it again before the worker is ready to take a
      # call. Only the worker loads it; the token server never does.
      #
      # A NAMED volume, as here, inherits ownership from the image — which creates /home/app/.cache
      # as the runtime user precisely so this works.
      # A BIND MOUNT does not: it keeps whatever the host directory already has, so an unprepared
      # path arrives root-owned and the download fails rather than being cached. To keep it beside
      # data/ where you can see and clear it, prepare the directory first and swap the line:
      #
      #   mkdir -p ./cache && chown -R 1000:1000 ./cache && chmod -R u+rwX ./cache
      #   - ./cache:/home/app/.cache
      - wavetalk-cache:/home/app/.cache
      # Optional: uncomment to edit TTS adapter configs without a rebuild.
      # - ./agent-worker/tts-adapters:/app/tts-adapters
    depends_on:
      - livekit-server
    networks:
      - callin-net

  token-server:
    image: ghcr.io/mrainone7p/wave-talk:latest
    container_name: wavetalk-web
    build:
      context: .
      dockerfile: agent-worker/Dockerfile
    command: ["python", "token_server.py"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    env_file: .env
    environment:
      # Inside a container "localhost" is the container itself — the env file's dev default would
      # make the LiveKit health check fail.
      - LIVEKIT_URL=ws://livekit-server:7880
      # Browsers connect here; station webhooks call back here. Both derive from HOST_IP so one
      # variable configures the whole deployment. LiveKit signalling goes through the caddy TLS port
      # — same origin as the page, so the one-time self-signed acceptance covers it.
      - LIVEKIT_PUBLIC_URL=wss://${HOST_IP:-localhost}:8443
      - CALLIN_HOOK_URL=http://${HOST_IP:-localhost}:8100/hooks/station
      # Where the CALLER'S BROWSER pulls the broadcast from while on the line. Only this service
      # needs it — it builds /live, which is what the widget reads. Blank derives the station's own
      # address, which is plain http on the LAN: correct for a plain-http deployment, and blocked as
      # mixed content on any TLS one (including via the caddy service below), where the caller then
      # hears no station at all. A bare origin works too — the mounts the station publishes are
      # discovered, mp3 first.
      - SUBWAVE_STREAM_URL=${SUBWAVE_STREAM_URL:-}
      - LOG_TO_FILE=0
    volumes:
      # Same directory, same uid — see the note on the worker's volume above.
      - ./data:/data
    ports:
      - "8100:8100"     # widget + token mint; put a reverse proxy in front
    # /health is the one endpoint that answers without auth and without touching the station, so it
    # says "this process is up and serving" and nothing more — which is exactly what a healthcheck
    # should mean. Caddy waits on this rather than on the container merely having been created, so a
    # restart cannot put the TLS front door in front of nothing.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8100/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    depends_on:
      - livekit-server
    networks:
      - callin-net

  # TLS front door. Browsers only allow the microphone on HTTPS origins, so the widget MUST be
  # opened via https://<HOST_IP>:8443 — the plain :8100 port stays for same-machine dev and the
  # station webhook callback.
  caddy:
    image: caddy:2
    container_name: wavetalk-caddy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    ports:
      - "8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      token-server:
        # Not just "created" — Caddy proxies to it, and coming up first meant the first load after a
        # restart got a 502 from a front door pointing at a process that had not finished starting.
        condition: service_healthy
      livekit-server:
        condition: service_started
    networks:
      - callin-net

volumes:
  caddy-data:
  # Only the worker loads the STT model, so only the worker mounts this.
  wavetalk-cache:

networks:
  callin-net:
    driver: bridge
