<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<!-- viewport-fit=cover so the card can reach under a notch; style.css pays
     that back with safe-area padding, or the Hang up row sits under the home
     indicator on an installed iPhone. -->
<!-- interactive-widget=resizes-content: when the on-screen keyboard opens, the
     viewport (and 100dvh) shrink to the space ABOVE it, so the chat input and
     the conversation stay laid out on screen instead of the keyboard covering
     the interface (operator-reported on mobile). -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<title>Talk Wave</title>

<!-- Installable. The point is not offline — a phone-in is useless offline —
     it is that a caller gets a home-screen icon and a window with no browser
     chrome in it, which is what a phone should look like. sw.js says what is
     and is not cached, and it is deliberately very little.
     Two theme-colors: the installed window's own furniture follows the same
     light/dark the card does, rather than always being the dark one. -->
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#f6f5f3" media="(prefers-color-scheme: light)" />
<link rel="icon" href="/favicon.png" sizes="32x32" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<!-- iOS reads neither the manifest's display mode nor its name. -->
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Talk Wave" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<!--
  The call surface, and only the call surface. Loads directly, or inside an
  <iframe> via embed.js.

  The settings panel is a SEPARATE PAGE at /panel. It used to be a section of
  this document, which meant every anonymous caller downloaded the whole
  operator interface — markup and javascript — to look at a page with one
  button on it. Keeping it out here also means the admin surface has its own
  URL, so a reverse proxy can put a rule in front of /settings that it could
  never put in front of the phone.

  ?compact=1 renders the embeddable card.

  Live feedback comes from real signals, not guesses:
    - agent state  -> the `lk.agent.state` participant attribute the Agents
                      SDK publishes (initializing/idle/listening/thinking/speaking)
    - levels       -> WebAudio AnalyserNode on the actual mic and DJ tracks
    - captions     -> the transcription text stream both sides publish

  Embedding note: the host page MUST set <iframe allow="microphone"> or
  getUserMedia fails silently. embed.js does this already.
-->
<!-- Pinned exactly: a floating @2 tag means a breaking client release lands
     silently on every visitor. Bump deliberately, test a call, then ship. -->
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.21.0/dist/livekit-client.umd.min.js"></script>
<!-- No webfonts. 0.9.92 pulled Archivo and IBM Plex Mono from Google so the
     widget's labels would match one particular station page — which is a
     request to a third party from every embed, on somebody else's site, for
     the sake of matching a page most of those embeds are not on. The design
     is the mono uppercase micro-label against a sans body, and the system
     stacks in style.css carry that anywhere. If the exact faces are ever
     wanted back, self-host them here rather than reintroducing the CDN. -->
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="card" data-mode="idle">
    <!-- The corner controls sit IN this row rather than being absolutely
         positioned over it. Absolute meant each one owned a hardcoded `right`
         offset, a second set of offsets for the embed, and a padding reserve
         on the row to keep the status clear of them — three places to get
         wrong every time the backend changed which controls a caller is
         offered. In the flow, hiding one just closes the gap.

         The label spacer is what pins them right. They used to follow
         #status, which carried the `margin-left:auto` — so on a live call,
         where the status is hidden, nothing pushed them anywhere and the
         three icons collected next to ON AIR NOW. The spacer eats the free
         space whatever else is in the row.

         The connection state is NOT in this row any more; it lives in the
         line area at the bottom of the card. See there. -->
    <div class="eyebrow" id="eyebrow"><span class="pip"></span><span id="eyebrowText">Checking…</span><span class="spacer"></span><div class="corner"><button class="gear" id="helpBtn" title="What can I ask?" aria-label="What can I ask?" hidden>?</button><button class="gear" id="themeBtn" title="Theme" aria-label="Change the theme" hidden><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.4v2.5M12 19.1v2.5M2.4 12h2.5M19.1 12h2.5M5.1 5.1l1.8 1.8M17.1 17.1l1.8 1.8M18.9 5.1l-1.8 1.8M6.9 17.1l-1.8 1.8"/></svg></button><button class="gear" id="signinBtn" title="Sign in for more options" aria-label="Sign in for more options" hidden><svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M6 12H2.5a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1H6"/><path d="M9 9.5 11.5 7 9 4.5"/><path d="M11.5 7H5.5"/></svg></button><button class="gear" id="lockBtn" title="Sign out — forget the code on this device" aria-label="Sign out — forget the code on this device" hidden><svg width="11" height="13" viewBox="0 0 11 13" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="1" y="5.5" width="9" height="6.5" rx="1"/><path d="M3 5.5V3.8a2.5 2.5 0 0 1 5 0v1.7"/></svg></button><button class="gear" id="gearBtn" title="Settings" aria-label="Settings" hidden>&#9881;</button></div></div>

    <div class="who-row">
      <img class="avatar hidden" id="djAvatar" alt="" />
      <!-- Shown in place of the image when a persona has no picture — or when
           the station serves a 1x1 placeholder for one, which loads without
           error and would otherwise stretch a single pixel across the ring.
           The DJ's initials read better than an empty circle. -->
      <span class="avatar avatar-mono hidden" id="djMono" aria-hidden="true"></span>
      <div class="meta">
        <h1 class="dj" id="djName">…</h1>
        <p class="show" id="djShow"></p>
        <p class="tagline" id="djTagline"></p>
      </div>
      <span class="spacer"></span>
      <!-- The state chips live IN the identity row. They had a band of their
           own (.staterow) costing 38px of card for two 26px chips, while the
           60px identity row beside them had the room for free. The id stays
           `stateRow` — call.js and the widget contract test both know it, and
           it still means the same thing: where the call's state is shown.
           In an embed these move to the eyebrow instead; see style.css. -->
      <span class="chips" id="stateRow">
        <span class="pill statechip" id="stateChip" data-state="idle" hidden><span class="sdot"></span><span id="stateText">Connecting</span></span>
        <span class="pill timechip" id="timeChip" hidden><span id="timeText">0:00</span><span class="tmax" id="timeMax"></span></span>
      </span>
    </div>

    <!-- Opened by the ? button. Built from the same list the panel shows the
         operator, filtered to what is switched on, so it can never suggest
         something the DJ would refuse. -->
    <div class="askpop" id="askPop" hidden role="dialog" aria-label="What you can ask">
      <div class="askpop-head">
        <strong>You can ask for…</strong>
        <!-- Whose menu this is. The list is already filtered to the caller's
             own tier server-side; this says so, quietly, instead of leaving
             a guest to wonder why a friend's list looked longer. -->
        <span class="askrole" id="askRole" hidden></span>
        <button class="askpop-close" id="askClose" aria-label="Close">&times;</button>
      </div>
      <ul class="askpop-list" id="askPopList"></ul>
    </div>

    <div class="michelp" id="micHelp" hidden></div>

    <!-- Everything a call needs, in one wrapper with one switch, because the
         whole lot has to hold its space whether or not anybody is on the
         line — see .rig in style.css.

         THE ORDER IS THE DESIGN, bottom-up: the action row is the card's
         last row on every surface — so an embed's Call button lines up with
         the host page's own bottom row of buttons — with the meters above it
         and the words above those. `visibility` is inherited but a child may
         declare its own, so the always-visible rows say `visible` and the
         reservation still applies to the rest. -->
    <div class="rig" id="rig">
      <!-- What is on the station, as its own rail. It used to sit in the
           spare space right of the DJ block, capped at 42% of the row, where
           a real title ellipsised after four words. Full width it fits, and
           the elapsed figure has somewhere to be.
           On a live call this dims and swaps the timer for UNDER THE CALL —
           the music is not the subject then, but knowing it kept playing is
           still worth a line. -->
      <div class="nprail" id="npRail">
        <p class="track" id="npTrack"></p>
        <span class="npclock" id="npElapsed"></span>
      </div>

    <!-- The line area. One box, one job: whatever this card has to say to
         the caller right now. Speech while a call runs; between calls its
         own messages — "No answer", "Call ended" — and nothing at all when
         there is nothing to say. The door code lives here too, and so does
         everything post-call: the transcript drawer and the how-was-it
         buttons are an overlay strip INSIDE this box, not bands of their
         own, because every band that appears after a call used to grow the
         card and move the host page under whoever was reading it. -->
    <div class="linebox" id="lineBox">
      <div class="captions" id="captions"></div>
      <div class="ticker" id="ticker" hidden><span class="who"></span><span class="line"></span></div>
      <p id="status"><span class="dot" id="dot"></span><span id="statusText"></span></p>

      <div class="guestgate" id="guestGate" hidden>
        <!-- A way back out. Opening this mid-chat used to be a one-way door:
             the only exit was a reload, which ends the conversation. -->
        <button type="button" id="guestClose" class="gclose"
                aria-label="Close">&times;</button>
        <span class="glabel" id="guestLabel">The booth line is private.</span>
        <span class="grow">
          <input type="password" id="guestPw" placeholder="access code" autocomplete="off" />
          <button id="guestBtn">Unlock</button>
        </span>
        <span id="guestMsg"></span>
      </div>

      <!-- First run, in the conversation's own space (operator's ask): until
           an admin password exists the line belongs to whoever walks up, so
           the place where words would appear says it and takes one — the
           guest gate's own skin, so the card keeps its exact shape. /live
           carries needsSetup per-request; never shown in an embed. -->
      <div class="guestgate" id="setupNudge" hidden>
        <span class="glabel">No admin password is set — this line belongs to whoever walks up. Set it here, or at <code>/settings</code>.</span>
        <span class="grow">
          <input type="password" id="setupPw" autocomplete="new-password"
                 placeholder="at least 8 characters" />
          <button id="setupPwBtn">Set password</button>
        </span>
        <span id="setupPwMsg"></span>
      </div>

      <div class="after" id="afterRow">
        <button class="callended" id="endedBar" hidden></button>
        <span class="rate" id="rateBar" hidden>
          <span class="rlabel" id="rateLabel">How was it?</span>
          <span class="rbtns" id="rateBtns">
            <!-- Line icons in the card's own ink, not the emoji glyphs — the
                 yellow cartoon hands were the one element on the card the
                 theme could not touch. Operator-reported. -->
            <button id="rateUp" title="That went well" aria-label="That went well"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg></button>
            <button id="rateDown" title="That went badly" aria-label="That went badly"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h2.67A2.31 2.31 0 0 1 22 4v7a2.31 2.31 0 0 1-2.33 2H17"/></svg></button>
          </span>
        </span>
      </div>
    </div>

      <!-- Meters and volume share ONE band: you | vol | DJ. The volume had a
           row of its own, and on an embed that row was ~41px of mostly air —
           the exact height that was stretching a host page's player column.
           Everything here is level-shaped, so one band reads as one thing. -->
      <!-- ONE duplex strip: volume on the left, then a single centre-out
           level meter — You grows leftward from the centre tick, the DJ
           rightward. Two separate meters either side of the volume read as
           two unrelated widgets and cost two labels, two troughs and two
           sets of segments to say one thing: there is a voice here, and
           whose. The mic chip moved up to the identity row with the others.
           #micChip's old wrapper (.mtop) is gone; #youLabel and #djLabel stay
           where the script expects them, either side of the trough. -->
      <div class="meters">
        <div class="vol">
          <label for="volSlider">Vol</label>
          <input type="range" id="volSlider" min="0" max="100" value="100" />
          <span class="pct" id="volPct">100%</span>
        </div>
        <div class="duplex" id="duplex">
          <span class="mlabel you" id="youLabel">You</span>
          <div class="trough">
            <div class="meter you" id="meterYou"><div class="bars" id="barsYou"></div><!-- MUTED / MIC OFF, written across the caller's own waveform.
                 It was a chip beside the clock and it was the one that
                 pushed the others off a narrow card; the state belongs on
                 the thing it is about, and there it costs no width. -->
            <span class="micchip" id="micChip" hidden></span></div>
            <span class="tick" aria-hidden="true"></span>
            <div class="meter dj" id="meterDj"><div class="bars" id="barsDj"></div></div>
          </div>
          <span class="mlabel dj" id="djLabel">DJ</span>
        </div>
      </div>

      <!-- The talk row: the push-to-talk bar (only on cards configured for
           it), with Mute and the speaker switch beside it — the controls
           that shape being HEARD, one row above the one that ends the call. -->
      <div class="talkrow">
        <!-- One line of copy. The second line ("or hold it down · space works
             too") explained the control twice and was the only two-line
             control on the card; the keycap says the same thing in the shape
             of the key it names. -->
        <button class="pttbar" id="pttBtn" type="button" aria-pressed="false">
          <span class="pttmain" id="pttMain">Hold to talk</span>
          <span class="keycap" id="pttKey" aria-hidden="true">Space</span>
        </button>
        <button id="spkBtn" title="Loudspeaker or earpiece" aria-pressed="true">Speaker</button>
        <button id="muteBtn">Mute</button>
      </div>

      <div class="chatrow" id="chatRow" hidden>
        <button id="chatEndBtn" type="button" class="chatend"
                title="Close the text line" aria-label="Close the text line">Close</button>
        <input type="text" id="chatInput" maxlength="2000"
               placeholder="Type to the booth…" autocomplete="off" />
        <button id="chatSendBtn" type="button">Send</button>
      </div>

      <!-- The last row of the card, on every surface. Idle it is Call (and
           the machine's door, if offered); on a call it is Hang up, full
           width, exactly where a thumb expects it. -->
      <div class="actionrow">
        <button id="callBtn" disabled>Call the DJ</button>
        <button id="chatBtn" hidden>Text the booth</button>
        <button id="vmBtn" hidden>Leave a message</button>
        <button id="hangBtn" hidden>Hang up</button>
      </div>
    </div>
  </div>

<script src="/shared.js"></script>
<script src="/call.js"></script>
</body>
</html>
