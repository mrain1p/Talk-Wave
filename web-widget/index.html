<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<!-- viewport-fit=cover so the card can reach under a notch; style.css pays
     that back with safe-area padding, or the Hang up row sits under the home
     indicator on an installed iPhone. -->
<!-- interactive-widget=resizes-content: when the on-screen keyboard opens, the
     viewport (and 100dvh) shrink to the space ABOVE it, so the chat input and
     the conversation stay laid out on screen instead of the keyboard covering
     the interface (operator-reported on mobile). -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<title>Talk Wave</title>

<!-- Installable. The point is not offline — a phone-in is useless offline —
     it is that a caller gets a home-screen icon and a window with no browser
     chrome in it, which is what a phone should look like. sw.js says what is
     and is not cached, and it is deliberately very little.
     Two theme-colors: the installed window's own furniture follows the same
     light/dark the card does, rather than always being the dark one. -->
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#f6f5f3" media="(prefers-color-scheme: light)" />
<!-- The mark: the caller's wave meets the DJ's. The .ico bundles hand-tuned
     16/32/48 whole-pixel variants (the 14-bar art fills in below ~48px); the
     SVG is for browsers that scale one file themselves. -->
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<!-- iOS reads neither the manifest's display mode nor its name. -->
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Talk Wave" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<!--
  The call surface, and only the call surface. Loads directly, or inside an
  <iframe> via embed.js.

  The settings panel is a SEPARATE PAGE at /panel. It used to be a section of
  this document, which meant every anonymous caller downloaded the whole
  operator interface — markup and javascript — to look at a page with one
  button on it. Keeping it out here also means the admin surface has its own
  URL, so a reverse proxy can put a rule in front of /settings that it could
  never put in front of the phone.

  ?compact=1 renders the embeddable card.

  Live feedback comes from real signals, not guesses:
    - agent state  -> the `lk.agent.state` participant attribute the Agents
                      SDK publishes (initializing/idle/listening/thinking/speaking)
    - levels       -> WebAudio AnalyserNode on the actual mic and DJ tracks
    - captions     -> the transcription text stream both sides publish

  Embedding note: the host page MUST set <iframe allow="microphone"> or
  getUserMedia fails silently. embed.js does this already.
-->
<!-- Pinned exactly: a floating @2 tag means a breaking client release lands
     silently on every visitor. Bump deliberately, test a call, then ship. -->
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.21.0/dist/livekit-client.umd.min.js"></script>
<!-- No webfonts. 0.9.92 pulled Archivo and IBM Plex Mono from Google so the
     widget's labels would match one particular station page — which is a
     request to a third party from every embed, on somebody else's site, for
     the sake of matching a page most of those embeds are not on. The design
     is the mono uppercase micro-label against a sans body, and the system
     stacks in style.css carry that anywhere. If the exact faces are ever
     wanted back, self-host them here rather than reintroducing the CDN. -->
<link rel="stylesheet" href="/style.css">
<!-- EXPERIMENTAL card skins. A second sheet rather than more of style.css:
     every rule in it is custom properties only, which is what a test can check
     and what keeps a skin from reaching the card's layout. Nothing applies
     until <html data-skin> is set. -->
<link rel="stylesheet" href="/skins.css">
</head>
<body>
  <div class="card" data-mode="idle">
    <!-- The corner controls sit IN this row rather than being absolutely
         positioned over it. Absolute meant each one owned a hardcoded `right`
         offset, a second set of offsets for the embed, and a padding reserve
         on the row to keep the status clear of them — three places to get
         wrong every time the backend changed which controls a caller is
         offered. In the flow, hiding one just closes the gap.

         The label spacer is what pins them right. They used to follow
         #status, which carried the `margin-left:auto` — so on a live call,
         where the status is hidden, nothing pushed them anywhere and the
         three icons collected next to ON AIR NOW. The spacer eats the free
         space whatever else is in the row.

         The connection state is NOT in this row any more; it lives in the
         line area at the bottom of the card. See there. -->
    <!-- No pip before ON AIR, and the listener count wears a line-drawn
         mark in the corner icons' own style rather than the old emoji: on a
         narrow phone the pip and the wide glyph together pushed the count
         under the player's pull tab, centred on this very band, and the
         number was simply not visible (operator's screenshot, 2026-08-18).
         The count is a separate element, not part of the text, so every
         painter of eyebrowText can leave it alone and it hides itself off
         air. -->
    <div class="eyebrow" id="eyebrow"><span id="eyebrowText">Checking…</span><span class="listeners" id="eyebrowListeners" title="Listening now" hidden><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 18v-6a8 8 0 0 1 16 0v6"/><rect x="2.6" y="13.5" width="4.2" height="6.5" rx="1.8"/><rect x="17.2" y="13.5" width="4.2" height="6.5" rx="1.8"/></svg><span id="eyebrowListenersN"></span></span><button class="ribbon" id="playerTab" type="button" hidden aria-label="Pull down the station player"><span class="grip" aria-hidden="true"></span></button><div class="corner"><button class="gear" id="helpBtn" title="What can I ask?" aria-label="What can I ask?" hidden>?</button><button class="gear" id="themeBtn" title="Theme" aria-label="Change the theme" hidden><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.4v2.5M12 19.1v2.5M2.4 12h2.5M19.1 12h2.5M5.1 5.1l1.8 1.8M17.1 17.1l1.8 1.8M18.9 5.1l-1.8 1.8M6.9 17.1l-1.8 1.8"/></svg></button><button class="gear" id="signinBtn" title="Sign in for more options" aria-label="Sign in for more options" hidden><svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M6 12H2.5a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1H6"/><path d="M9 9.5 11.5 7 9 4.5"/><path d="M11.5 7H5.5"/></svg></button><button class="gear" id="lockBtn" title="Sign out — forget the code on this device" aria-label="Sign out — forget the code on this device" hidden><svg width="11" height="13" viewBox="0 0 11 13" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="1" y="5.5" width="9" height="6.5" rx="1"/><path d="M3 5.5V3.8a2.5 2.5 0 0 1 5 0v1.7"/></svg></button><a class="gear" id="linkBtn" href="#" target="_blank" rel="noopener noreferrer" title="" hidden></a><button class="gear" id="gearBtn" title="Settings" aria-label="Settings" hidden>&#9881;</button></div></div>

    <div class="who-row">
      <img class="avatar hidden" id="djAvatar" alt="" />
      <!-- Shown in place of the image when a persona has no picture — or when
           the station serves a 1x1 placeholder for one, which loads without
           error and would otherwise stretch a single pixel across the ring.
           The DJ's initials read better than an empty circle. -->
      <span class="avatar avatar-mono hidden" id="djMono" aria-hidden="true"></span>
      <div class="meta">
        <h1 class="dj" id="djName">…</h1>
        <p class="show" id="djShow"></p>
        <p class="tagline" id="djTagline"></p>
        <!-- What is on the station, under the identity it belongs to. It had
             the rail below to itself and then had to share it with the call's
             state chips, which on a phone put a long title under two chips and
             overlapped them. Both fit if they stop competing for one row: the
             record is part of WHO IS ON, and the chips are part of the call.
             Same on the page and in an embed. The heart rides the SAME row —
             a new row would change the card's height, which is the one thing
             the card promises never to do. -->
        <div class="trackrow"><p class="track" id="npTrack"></p><button class="nplike" id="npHeart" type="button" aria-pressed="false" aria-label="Like this track" hidden>&#9825;</button></div>
      </div>
    </div>

    <!-- Opened by the ? button. Built from the same list the panel shows the
         operator, filtered to what is switched on, so it can never suggest
         something the DJ would refuse. -->
    <div class="askpop" id="askPop" hidden role="dialog" aria-label="What you can ask">
      <div class="askpop-head">
        <strong>You can ask for…</strong>
        <!-- Whose menu this is. The list is already filtered to the caller's
             own tier server-side; this says so, quietly, instead of leaving
             a guest to wonder why a friend's list looked longer. -->
        <span class="askrole" id="askRole" hidden></span>
        <button class="askpop-close" id="askClose" aria-label="Close">&times;</button>
      </div>
      <ul class="askpop-list" id="askPopList"></ul>
    </div>

    <div class="michelp" id="micHelp" hidden></div>

    <!-- Everything a call needs, in one wrapper with one switch, because the
         whole lot has to hold its space whether or not anybody is on the
         line — see .rig in style.css.

         THE ORDER IS THE DESIGN, bottom-up: the action row is the card's
         last row on every surface — so an embed's Call button lines up with
         the host page's own bottom row of buttons — with the meters above it
         and the words above those. `visibility` is inherited but a child may
         declare its own, so the always-visible rows say `visible` and the
         reservation still applies to the rest. -->
    <div class="rig" id="rig">
      <!-- What is on the station, as its own rail. It used to sit in the
           spare space right of the DJ block, capped at 42% of the row, where
           a real title ellipsised after four words. Full width it fits, and
           the elapsed figure has somewhere to be.
           On a live call this dims and swaps the timer for UNDER THE CALL —
           the music is not the subject then, but knowing it kept playing is
           still worth a line. -->
      <!-- The state chips live HERE now, not in the identity row. They were
           beside the DJ's name, competing with it for width on exactly the
           cards that had none, and this band was often empty anyway — the
           operator's ask was to put them where the track is and collapse the
           row when it holds neither. The id stays `stateRow`: call.js and the
           widget contract test both know it, and it still means the same
           thing, which is where the call's state is shown. -->
      <div class="nprail" id="npRail">
        <span class="npclock" id="npElapsed"></span>
        <span class="npbar" hidden aria-hidden="true"><span class="npfill"></span></span>
        <span class="npclock nptotal" id="npTotal" hidden></span>
        <span class="chips" id="stateRow">
          <span class="pill statechip" id="stateChip" data-state="idle" hidden><span class="sdot"></span><span id="stateText">Connecting</span></span>
          <span class="pill onairchip" id="onAirBadge" hidden><span class="sdot"></span><span id="onAirBadgeText">ON AIR</span></span>
          <span class="pill timechip" id="timeChip" hidden><span id="timeText">0:00</span><span class="tmax" id="timeMax"></span></span>
          <!-- The door into the station player, only when the operator has
               switched it on AND a stream resolved — a chip that opens onto
               silence is worse than no chip. The swipe gesture is the other
               way in; this is the one a mouse (and a screen reader) gets. -->
          <button class="pill listenchip" id="listenChip" type="button" hidden>Listen</button>
        </span>
      </div>

    <!-- The line area. One box, one job: whatever this card has to say to
         the caller right now. Speech while a call runs; between calls its
         own messages — "No answer", "Call ended" — and nothing at all when
         there is nothing to say. The door code lives here too, and so does
         everything post-call: the transcript drawer and the how-was-it
         buttons are an overlay strip INSIDE this box, not bands of their
         own, because every band that appears after a call used to grow the
         card and move the host page under whoever was reading it. -->
    <!-- The route: the operator's design 4c, the "word switch" — ON AIR |
         OFF AIR straddling the stage's top edge, both the control and the
         status. A SIBLING of the linebox, not a child: the box scrolls its
         own overflow, so anything poking above its border is sheared off
         (seen in the stub). Normal flow with a negative bottom margin makes
         the straddle without an absolute anchor. Exists only while the
         phone-in door is open AND the mixer probe answered; the frame, the
         stage message and the Call button all follow it. -->
    <div class="routeswitch" id="routeSwitch" hidden role="radiogroup"
         aria-label="Where this call goes">
      <button type="button" class="rcell" id="routeOff" role="radio"
              aria-checked="true"><span class="rpip" aria-hidden="true"></span>OFF AIR</button>
      <button type="button" class="rcell live" id="routeOn" role="radio"
              aria-checked="false"><span class="rpip" aria-hidden="true"></span>ON AIR</button>
    </div>
    <div class="linebox" id="lineBox">
      <!-- The skin's idle artefact — a platter, a dial, a reticle. Empty and
           invisible unless a skin fills --skin-art in, absolutely positioned
           BEHIND everything here, and shown only while the card is idle. It
           cannot move the layout and it is gone the moment a call starts. -->
      <div class="skinart" id="skinArt" aria-hidden="true"><span class="skinword"
           id="skinWord"></span></div>
      <!-- What the box says when there is no conversation in it: which
           doors are open, in the card's own voice. See paintBoard. -->
      <div class="idleboard" id="idleBoard" hidden></div>
      <div class="captions" id="captions"></div>
      <div class="ticker" id="ticker" hidden><span class="who"></span><span class="line"></span></div>
      <p id="status"><span class="dot" id="dot"></span><span id="statusText"></span></p>

      <div class="guestgate" id="guestGate" hidden>
        <!-- A way back out. Opening this mid-chat used to be a one-way door:
             the only exit was a reload, which ends the conversation. -->
        <button type="button" id="guestClose" class="gclose"
                aria-label="Close">&times;</button>
        <span class="glabel" id="guestLabel">The booth line is private.</span>
        <span class="grow">
          <input type="password" id="guestPw" placeholder="access code" autocomplete="off" />
          <button id="guestBtn">Unlock</button>
        </span>
        <span id="guestMsg"></span>
      </div>

      <!-- First run, in the conversation's own space (operator's ask): until
           an admin password exists the line belongs to whoever walks up, so
           the place where words would appear says it and takes one — the
           guest gate's own skin, so the card keeps its exact shape. /live
           carries needsSetup per-request; never shown in an embed. -->
      <div class="guestgate" id="setupNudge" hidden>
        <span class="glabel">No admin password is set — this line belongs to whoever walks up. Set it here, or at <code>/settings</code>.</span>
        <span class="grow">
          <input type="password" id="setupPw" autocomplete="new-password"
                 placeholder="at least 8 characters" />
          <button id="setupPwBtn">Set password</button>
        </span>
        <span id="setupPwMsg"></span>
      </div>

      <div class="after" id="afterRow">
        <button class="callended" id="endedBar" hidden></button>
        <span class="rate" id="rateBar" hidden>
          <span class="rlabel" id="rateLabel">How was it?</span>
          <span class="rbtns" id="rateBtns">
            <!-- Line icons in the card's own ink, not the emoji glyphs — the
                 yellow cartoon hands were the one element on the card the
                 theme could not touch. Operator-reported. -->
            <button id="rateUp" title="That went well" aria-label="That went well"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg></button>
            <button id="rateDown" title="That went badly" aria-label="That went badly"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h2.67A2.31 2.31 0 0 1 22 4v7a2.31 2.31 0 0 1-2.33 2H17"/></svg></button>
          </span>
        </span>
      </div>
    </div>

      <!-- Meters and volume share ONE band: you | vol | DJ. The volume had a
           row of its own, and on an embed that row was ~41px of mostly air —
           the exact height that was stretching a host page's player column.
           Everything here is level-shaped, so one band reads as one thing. -->
      <!-- ONE duplex strip: volume on the left, then a single centre-out
           level meter — You grows leftward from the centre tick, the DJ
           rightward. Two separate meters either side of the volume read as
           two unrelated widgets and cost two labels, two troughs and two
           sets of segments to say one thing: there is a voice here, and
           whose. The mic chip moved up to the identity row with the others.
           #micChip's old wrapper (.mtop) is gone; #youLabel and #djLabel stay
           where the script expects them, either side of the trough. -->
      <div class="meters">
        <div class="vol">
          <label for="volSlider">Vol</label>
          <input type="range" id="volSlider" min="0" max="100" value="100" />
          <span class="pct" id="volPct">100%</span>
        </div>
        <div class="duplex" id="duplex">
          <span class="mlabel you" id="youLabel">You</span>
          <div class="trough">
            <div class="meter you" id="meterYou"><div class="bars" id="barsYou"></div><!-- MUTED / MIC OFF, written across the caller's own waveform.
                 It was a chip beside the clock and it was the one that
                 pushed the others off a narrow card; the state belongs on
                 the thing it is about, and there it costs no width. -->
            <span class="micchip" id="micChip" hidden></span></div>
            <span class="tick" aria-hidden="true"></span>
            <div class="meter dj" id="meterDj"><div class="bars" id="barsDj"></div></div>
          </div>
          <span class="mlabel dj" id="djLabel">DJ</span>
        </div>
      </div>

      <!-- The talk row: the push-to-talk bar (only on cards configured for
           it), with Mute and the speaker switch beside it — the controls
           that shape being HEARD, one row above the one that ends the call. -->
      <div class="talkrow">
        <!-- One line of copy. The second line ("or hold it down · space works
             too") explained the control twice and was the only two-line
             control on the card; the keycap says the same thing in the shape
             of the key it names. -->
        <button class="pttbar" id="pttBtn" type="button" aria-pressed="false">
          <span class="pttmain" id="pttMain">Hold to talk</span>
          <span class="keycap" id="pttKey" aria-hidden="true">Space</span>
        </button>
        <button id="spkBtn" title="Loudspeaker or earpiece" aria-pressed="true">Speaker</button>
        <button id="muteBtn">Mute</button>
      </div>

      <div class="chatrow" id="chatRow" hidden>
        <button id="chatEndBtn" type="button" class="chatend"
                title="Close the text line" aria-label="Close the text line">Close</button>
        <input type="text" id="chatInput" maxlength="2000"
               placeholder="Type to the booth…" autocomplete="off" />
        <button id="chatSendBtn" type="button">Send</button>
      </div>

      <!-- The soundbite studio: greeting → record → review → send. Shown only
           in the 'vmstudio' card mode; everything else on the card hides (the
           same one-mode-at-a-time rule as chat). The transcript, the action
           preview and the send receipt all render in the LINEBOX above, as
           caption lines and action cards — the box does the work instead of
           sitting empty (operator's redesign, 2026-08-17). The record bar is
           the real talk bar's markup so it looks and answers like one. -->
      <div class="vmstudio" id="vmStudio" hidden>
        <div class="vmbarrow" id="vmBarRow">
          <button class="pttbar" id="vmRecBtn" type="button" aria-pressed="false">
            <span class="pttmain" id="vmRecMain">Hold to record</span>
            <span class="keycap" aria-hidden="true">Space</span>
          </button>
          <button id="vmCloseBtn" type="button">Cancel</button>
        </div>
        <!-- The verb that MATTERS takes the whole top row (operator's order);
             the three lesser verbs share the one beneath. Placement is the
             stylesheet's grid, so the source order stays tab order. -->
        <div class="vmgrid" id="vmGrid" hidden>
          <button id="vmSendBtn" type="button">Send&nbsp;to&nbsp;booth&nbsp;➤</button>
          <!-- Icon over word, so a third of a narrow card never truncates a
               verb — "RER…" reached the operator's phone. -->
          <button id="vmPlayBtn" type="button"><span class="vico" aria-hidden="true">▶</span>Play</button>
          <button id="vmRerecBtn" type="button"><span class="vico" aria-hidden="true">↺</span>Rerecord</button>
          <button id="vmCancelBtn" type="button"><span class="vico" aria-hidden="true">✕</span>Cancel</button>
        </div>
      </div>

      <!-- The last row of the card, on every surface. Idle it is Call (and
           the machine's door, if offered); on a call it is Hang up, full
           width, exactly where a thumb expects it. -->
      <div class="actionrow">
        <button id="callBtn" disabled>Call the DJ</button>
        <button id="chatBtn" hidden>Text the booth</button>
        <button id="vmBtn" hidden>Leave a message</button>
        <button id="hangBtn" hidden>Hang up</button>
      </div>
    </div>

    <!-- The station player: a SHEET pulled down over the card by the ribbon
         at the top edge (operator's design — "a page wipe with the card
         coming over the frame"), swiped back up to reveal the phone. A
         direct child of the card, NOT a rig row, and that is load-bearing:
         .rig reserves visibility for the call's own rows, and the first
         build sat inside it — laid out, measured by every probe, painting
         nothing (operator's phone, 2026-08-17). Full page and the installed
         app only, never an embed. -->
    <div class="player" id="playerView" hidden role="region" aria-label="Station player">
      <!-- The operator's 3a "Glow player" handoff, in the card's own tokens:
           header ribbon, glow art, 30px title, amber chips, the two info
           panels, and a docked action bar. The grabber at the dock's foot is
           the way back up — the top tab hides while the player is open. -->
      <!-- The listener count beside the words, same mark as the header's
           (operator's ask, 2026-08-18): whoever opened the deck is one of
           the people this number counts. -->
      <div class="plhead"><span class="pip" aria-hidden="true"></span>Now playing<span class="listeners" id="plListeners" title="Listening now" hidden><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 18v-6a8 8 0 0 1 16 0v6"/><rect x="2.6" y="13.5" width="4.2" height="6.5" rx="1.8"/><rect x="17.2" y="13.5" width="4.2" height="6.5" rx="1.8"/></svg><span id="plListenersN"></span></span><span class="plheadmeta" id="plHeadMeta"></span><button type="button" class="plseg" id="plSegBtn" hidden aria-haspopup="true" aria-expanded="false" aria-label="Start an Open Lines segment">Segment</button><button class="gear" id="plCastBtn" title="Play on a device" aria-label="Play the stream on another device" hidden><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 20h.01"/><path d="M2 16a4 4 0 0 1 4 4"/><path d="M2 12a8 8 0 0 1 8 8"/><path d="M6 4h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-5"/></svg></button><button class="gear" id="plThemeBtn" title="Theme" aria-label="Change the theme" hidden></button></div>
      <!-- The segment sheet: only ever rendered for a caller /live says may
           trigger one, which is a guest or the operator AND the setting on.
           It offers a length and where the subject comes from — never the
           shelf itself, because this page is public and the shelf is the
           operator's own writing. The server picks. -->
      <div class="plsegpop" id="plSegPop" hidden role="dialog" aria-label="Start a segment">
        <label class="plseglab" for="plSegSource">Subject</label>
        <select id="plSegSource">
          <option value="dj">Let the DJ make one up</option>
          <option value="shelf">Next off the shelf</option>
        </select>
        <label class="plseglab" for="plSegMins">For</label>
        <select id="plSegMins">
          <option value="15">15 minutes</option>
          <option value="30">30 minutes</option>
          <option value="60" selected>1 hour</option>
        </select>
        <button type="button" class="plseggo" id="plSegGo">Put it up</button>
        <p class="plsegsay" id="plSegSay"></p>
      </div>
      <!-- The record's colours, washed across the sheet behind everything —
           a second, far larger blur of the SAME artwork, so the card stops
           being a hard-edged sleeve on a flat ground (operator's ask,
           2026-08-31, "the way Plexamp does it"). -->
      <img class="plambient" id="plAmbient" alt="" aria-hidden="true" hidden />
      <div class="plscroll">
        <span class="plartwrap"><img class="plglow" id="plGlow" alt="" aria-hidden="true" hidden /><span class="plart"><img id="plArt" alt="" hidden /><span class="plmono" id="plMono" aria-hidden="true" hidden></span></span></span>
        <div class="pltrack" id="plTrack"></div>
        <div class="plalbum" id="plAlbum"></div>
        <div class="pltags" id="plTags"></div>
        <div class="plprog"><span class="plel" id="plElapsed"></span><span class="plbar" aria-hidden="true"><span class="plfill"></span></span><span class="pllen" id="plLen"></span></div>
        <!-- Up next and Just played share ONE card, its two faces worn as
             BOOKMARK TABS on the card's shoulder (the operator's shape,
             2026-08-31, fourth ruling on this pair): the active tab fills
             and merges into the panel, the idle one sits quiet beside it,
             both in the same micro-type. The JUST PLAYED tab offers itself
             only when there is history. Both faces answer from the same
             /state snapshot. -->
        <div class="plqgroup">
        <div class="pltabs" role="tablist" aria-label="Queue and history">
          <button type="button" class="pltab on" id="plTabNext" role="tab" aria-selected="true"><span class="ppip" id="plNextPip" aria-hidden="true"></span>Up next</button>
          <button type="button" class="pltab" id="plTabPast" role="tab" aria-selected="false" hidden>Just played</button>
          <span class="plpanelmeta" id="plNextMeta"></span>
        </div>
        <div class="plpanel plqueue">
          <div class="plpanelbody" id="plNextBody"></div>
          <div class="plpanelbody" id="plPastBody" hidden></div>
        </div>
        </div>
        <div class="plpanel">
          <div class="plpanelhead"><span class="ppip live" aria-hidden="true"></span>In the booth<span class="plpanelmeta" id="plBoothMeta"></span></div>
          <div class="plpanelbody" id="plBoothBody"></div>
        </div>
      </div>
      <div class="pldock">
        <div class="plctl">
          <button class="plheart" id="plHeartBtn" type="button" aria-pressed="false" aria-label="Like this track" hidden>&#9825;</button>
          <!-- The count lives NEXT TO the heart, not in its title attribute:
               a tooltip needs a hover, and the surface this sheet was built
               for has no cursor to hover with. -->
          <span class="pllikes" id="plLikeCount" title="Likes" hidden></span>
          <!-- A speaker, not a note: beside a full-width red slider the note
               read as "track position", and the volume is the one control
               here a listener grabs first (operator's review, 2026-08-24).
               A button now, not decoration — an icon that looks tappable
               and does nothing reads as broken, so the tap it invites is
               the one it does: mute. -->
          <button type="button" class="plnote" id="plMuteBtn" aria-pressed="false" aria-label="Mute the player"><svg class="plspk" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9.4 9.4 0 0 1 0 13"/></svg><svg class="plspkoff" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m16 9 6 6"/><path d="m22 9-6 6"/></svg></button>
          <input type="range" id="plVol" min="0" max="100" value="100" aria-label="Player volume" />
          <span class="plvu" id="plVu" aria-hidden="true"></span>
        </div>
        <!-- Requests above the transport (operator's order): the input reads
             first, the big PAUSE stays nearest the thumb. -->
        <div class="plreq">
          <input type="text" id="plReqInput" maxlength="200" autocomplete="off"
                 placeholder="Request: An artist, song, or vibe." />
          <button id="plReqSend" type="button">Send</button>
        </div>
        <div class="plreqmsg" id="plReqMsg"></div>
        <!-- Icon + word, and the icon rides the sheet's playing class: a
             transport that is only a word read as a form button, not as the
             player's own control. The word stays — a bare glyph would be
             the one control on the sheet that doesn't say what it does. -->
        <button id="plPlayBtn" type="button"><svg class="plpi plpi-play" width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg><svg class="plpi plpi-pause" width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.5 4.5h4v15h-4zM13.5 4.5h4v15h-4z"/></svg><span id="plPlayWord">Pause</span></button>
        <!-- Grip only, both tabs (operator, 2026-08-24, second ruling):
           the words came and went in one day — a stylised pull tab says
           "pull me" better than a label crowding the row. -->
      <button class="plgrab" id="plGrab" type="button" aria-label="Back to the phone"><span class="grip" aria-hidden="true"></span></button>
      </div>
    </div>
  </div>

<script src="/shared.js"></script>
<script src="/call.js"></script>
</body>
</html>
