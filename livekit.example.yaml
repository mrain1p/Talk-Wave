# Self-hosted LiveKit config. Copy to livekit.yaml and generate your OWN keypair — never deploy
# the published example key:  python -c "import secrets; print('devkey:', secrets.token_urlsafe(36))"
# The name/secret must match LIVEKIT_API_KEY / LIVEKIT_API_SECRET in .env.
port: 7880

rtc:
  udp_port: 7882      # ALL call audio, muxed — the one port outside callers must reach
  tcp_port: 7881      # ICE/TCP fallback for networks that block UDP
  # false = local dev (browser and server on one host). true = callers from anywhere: LiveKit
  # discovers its public address via STUN and offers it. Note false still offers HOST candidates —
  # a global IPv6 on this machine reaches IPv6 callers with no forwarding either way.
  use_external_ip: false
  # DO NOT set node_ip unless you know you need it: it OVERRIDES the discovered public address,
  # so a LAN value silently breaks every off-LAN caller while working perfectly on the LAN.
  # It exists for bridge networking, where LiveKit would otherwise advertise its container IP.
  # node_ip: 192.168.1.10
  # Restrict candidate/bind enumeration to your real interface (ip -o addr). Without this, VM
  # bridges and docker networks are enumerated too — slow connectivity checks at best, and a
  # bridge holding a tentative IPv6 crash-loops the media port bind at worst.
  # interfaces:
  #   includes:
  #     - eth0

logging:
  level: info

keys:
  devkey: REPLACE_WITH_A_FRESH_SECRET
